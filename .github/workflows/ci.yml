name: Test galaxy-sync
on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

# Jobs get a read-only token unless they ask for more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sanity:
    name: run sanity checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - name: Run sanity tests
      run: uv run tox run -e sanity

  # Builds the scheduler Worker as a deploy would, without deploying or any
  # Cloudflare credentials. Deploys are still by hand: see "The scheduler" in
  # docs/sync.md.
  scheduler:
    name: check the scheduler
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 22

    - name: Build the Worker
      working-directory: scheduler
      run: npx --yes wrangler@4.151.1 deploy --dry-run --outdir "$RUNNER_TEMP/scheduler"
      env:
        WRANGLER_SEND_METRICS: "false"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    # Tests talk to a local mock of Galaxy and never reach the network or R2.
    - name: Test
      run: uv run tox run -e py315-tests
      env:
        PYTEST_ADDOPTS: --color=yes --junitxml junit/test-results.xml

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: Unit Test Results
        path: ./junit/test-results.xml

    - name: Upload Coverage Results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: Coverage Results
        path: ./coverage.xml
