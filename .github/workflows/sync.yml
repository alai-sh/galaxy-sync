name: Sync
# Started every 10 minutes by the Cloudflare Worker in scheduler/, not a
# schedule trigger: GitHub runs those late or not at all. See "Scheduling" in
# docs/sync.md.
on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, never cancelled part way. GitHub keeps only the newest
# waiting run, which loses nothing: what to do is queued in the state bucket,
# so every run picks up where the last one stopped.
concurrency:
  group: galaxy-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    # Setting the release to run starts the syncs.
    if: vars.GALAXY_SYNC_REF != ''
    runs-on: ubuntu-latest
    # The run stops starting work after --budget (45 minutes). A sweep started
    # just before that runs to the end, 30-40 minutes or more on a slow day.
    timeout-minutes: 90
    environment: r2
    permissions:
      contents: read
      issues: write
    steps:
    # The release to run, not main: see "Releases" in docs/sync.md. The job's
    # `if` skips the run until it's set.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ vars.GALAXY_SYNC_REF }}
        persist-credentials: false

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

    - name: Sync
      run: uv run --locked galaxy-sync sync --r2 --report report.md --alerts alerts --acknowledged acknowledged.jsonl -v
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        ALAI_INDEX_BUCKET: ${{ vars.ALAI_INDEX_BUCKET }}
        ALAI_DL_BUCKET: ${{ vars.ALAI_DL_BUCKET }}
        ALAI_STATE_BUCKET: ${{ vars.ALAI_STATE_BUCKET }}

    # The report block is kept at the top of the tracking issue's description,
    # edited only when it changed; edits don't notify anyone. Each conflict
    # opened this run is posted as its own comment, and failures that became
    # persistent as one more, which notifies the issue's subscribers. A
    # conflict acknowledged this run gets the note added to its comment,
    # which is then marked resolved (minimized).
    - name: Report
      if: vars.TRACKING_ISSUE != ''
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE: ${{ vars.TRACKING_ISSUE }}
      run: |
        if [ -f report.md ]; then
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          python3 -I .github/scripts/issue_body.py body.md report.md > new-body.md
          if [ -s new-body.md ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file new-body.md
          fi
        fi
        for comment in alerts/*.md; do
          if [ -f "$comment" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
          fi
        done
        if [ -s acknowledged.jsonl ]; then
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            --jq '.[] | {id, node_id, body}' > comments.jsonl
          python3 -I .github/scripts/resolve_comments.py comments.jsonl acknowledged.jsonl resolved \
            | while read -r id node; do
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@resolved/$id.md" --silent
              gh api graphql --silent -f id="$node" -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: RESOLVED}) { clientMutationId }
                }'
            done
        fi

    # A dead man's switch (e.g. healthchecks.io) alerts when these pings stop:
    # the job failing, the workflow being disabled, or the scheduler not
    # starting it.
    - name: Heartbeat
      env:
        HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
      run: |
        if [ -n "$HEARTBEAT_URL" ]; then
          curl -fsS -m 10 --retry 3 -o /dev/null "$HEARTBEAT_URL"
        fi
