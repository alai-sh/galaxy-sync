name: Acknowledge
on:
  workflow_dispatch:
    inputs:
      conflicts:
        description: Space-separated NS.NAME:VERSION conflicts to acknowledge, once inspected
        type: string
        required: true
      note:
        description: Why they're acknowledged; published with them
        type: string
        required: true

permissions:
  contents: read

# No shared concurrency group: like a refresh, this only writes its own
# request object, which the next sync takes, so it can run alongside one.

jobs:
  acknowledge:
    name: acknowledge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: r2
    steps:
    # The release to run, not main: see "Releases" in docs/sync.md.
    - name: Check the release
      env:
        REF: ${{ vars.GALAXY_SYNC_REF }}
      run: |
        if [ -z "$REF" ]; then
          echo "::error::set the GALAXY_SYNC_REF repository variable to the tag to run"
          exit 1
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ vars.GALAXY_SYNC_REF }}
        persist-credentials: false

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - name: Queue the request
      # Inputs go through the environment, never into the script itself.
      run: |
        read -ra conflicts <<< "$CONFLICTS"
        args=()
        for conflict in "${conflicts[@]}"; do
          args+=(--ack "$conflict")
        done
        uv run --locked galaxy-sync refresh --r2 -v "${args[@]}" --note "$NOTE"
      env:
        CONFLICTS: ${{ inputs.conflicts }}
        NOTE: ${{ inputs.note }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        ALAI_INDEX_BUCKET: ${{ vars.ALAI_INDEX_BUCKET }}
        ALAI_DL_BUCKET: ${{ vars.ALAI_DL_BUCKET }}
        ALAI_STATE_BUCKET: ${{ vars.ALAI_STATE_BUCKET }}
