name: Rebuild
on:
  workflow_dispatch:
    inputs:
      dl:
        description: Artifact URL template; empty for the default
        type: string
        default: ""
      galaxy_view:
        description: Also rewrite the Galaxy view, which is most of a rebuild's time; untick to only update the plugin index (needs dl empty)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rebuild:
    name: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub-hosted runners' limit; a full rebuild is about 4 hours
    environment: r2
    permissions:
      contents: read
      actions: write  # to pause the syncs
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    # The release to run, not main: see "Releases" in docs/sync.md.
    - name: Check the release
      env:
        REF: ${{ vars.GALAXY_SYNC_REF }}
      run: |
        if [ -z "$REF" ]; then
          echo "::error::set the GALAXY_SYNC_REF repository variable to the tag to run"
          exit 1
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ vars.GALAXY_SYNC_REF }}
        persist-credentials: false

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

    # A rebuild can't share the sync's concurrency group: the next dispatched
    # sync would replace it while it waited. So it disables sync.yml instead,
    # which the scheduler checks before dispatching, and waits for any sync
    # still running. The first wait covers a dispatch sent just before the
    # disable whose run isn't listed yet. A sync that was already paused, e.g.
    # by hand for a deploy, is left paused afterwards.
    - name: Pause syncs
      id: pause
      run: |
        state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sync.yml" --jq .state)
        if [ "$state" = "active" ]; then
          gh workflow disable sync.yml --repo "$GITHUB_REPOSITORY"
          echo "paused=true" >> "$GITHUB_OUTPUT"
        else
          echo "syncs are already paused ($state); leaving them paused"
        fi
        sleep 30
        while [ -n "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sync.yml --json status \
            --jq '.[] | select(.status != "completed") | .status')" ]; do
          sleep 30
        done

    - name: Rebuild
      run: |
        args=()
        if [ -n "$DL" ]; then
          args+=(--dl "$DL")
        fi
        if [ "$GALAXY_VIEW" = "false" ]; then
          args+=(--no-galaxy-view)
        fi
        uv run --locked galaxy-sync rebuild --r2 -v "${args[@]}"
      env:
        DL: ${{ inputs.dl }}
        GALAXY_VIEW: ${{ inputs.galaxy_view }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        ALAI_INDEX_BUCKET: ${{ vars.ALAI_INDEX_BUCKET }}
        ALAI_DL_BUCKET: ${{ vars.ALAI_DL_BUCKET }}
        ALAI_GALAXY_BUCKET: ${{ vars.ALAI_GALAXY_BUCKET }}
        ALAI_STATE_BUCKET: ${{ vars.ALAI_STATE_BUCKET }}
        CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        ALAI_INDEX_URL: ${{ vars.ALAI_INDEX_URL }}

    - name: Resume syncs
      if: always() && steps.pause.outputs.paused == 'true'
      run: gh workflow enable sync.yml --repo "$GITHUB_REPOSITORY"
