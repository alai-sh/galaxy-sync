name: Request
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to ask the next sync for
        type: choice
        options:
          - mirror
          - sweep
          - generate-plugins
          - generate-indexes
        default: mirror
      targets:
        description: Space-separated NS or NS.NAME. Needed for mirror, none for sweep, and empty means every collection for generate-*
        type: string
        default: ""
      revalidate:
        description: mirror only. Also check every mirrored artifact against the one Galaxy publishes now
        type: boolean
        default: false
      from-plugin-cache:
        description: generate-plugins only. Fetch only the artifacts whose plugin extraction is missing or out of date
        type: boolean
        default: false

permissions:
  contents: read

# No shared concurrency group: a request only writes its own request object,
# which the next sync takes, so it can run alongside one.

jobs:
  request:
    name: request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: r2
    steps:
    # The release to run, not main: see "Releases" in docs/sync.md.
    - name: Check the release
      env:
        REF: ${{ vars.GALAXY_SYNC_REF }}
      run: |
        if [ -z "$REF" ]; then
          echo "::error::set the GALAXY_SYNC_REF repository variable to the tag to run"
          exit 1
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ vars.GALAXY_SYNC_REF }}
        persist-credentials: false

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - name: Queue the request
      # Inputs go through the environment, never into the script itself.
      run: |
        read -ra targets <<< "$TARGETS"
        args=()
        if [ "$REVALIDATE" = "true" ]; then
          args+=(--revalidate)
        fi
        if [ "$FROM_PLUGIN_CACHE" = "true" ]; then
          args+=(--from-plugin-cache)
        fi
        # sweep takes no targets, and a bare -- is an error then.
        if [ "${#targets[@]}" -gt 0 ]; then
          args+=(-- "${targets[@]}")
        fi
        uv run --locked galaxy-sync request "$ACTION" --r2 -v "${args[@]}"
      env:
        ACTION: ${{ inputs.action }}
        TARGETS: ${{ inputs.targets }}
        REVALIDATE: ${{ inputs.revalidate }}
        FROM_PLUGIN_CACHE: ${{ inputs.from-plugin-cache }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        ALAI_INDEX_BUCKET: ${{ vars.ALAI_INDEX_BUCKET }}
        ALAI_DL_BUCKET: ${{ vars.ALAI_DL_BUCKET }}
        ALAI_STATE_BUCKET: ${{ vars.ALAI_STATE_BUCKET }}
