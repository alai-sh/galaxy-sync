version: 2
updates:
# Actions are pinned to commit SHAs; this keeps the pins and their version
# comments current.
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  # Wait a week before taking a new release, in case it is pulled or compromised.
  cooldown:
    default-days: 7
  groups:
    actions:
      patterns:
      - "*"
